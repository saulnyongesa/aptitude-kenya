{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="bk-border p-4 p-md-5">
                <h3 class="fw-bold mb-3 text-center">Reset Password</h3>
                <form method="post">
                    {% csrf_token %}
                    <label class="form-label small fw-bold">Email Address</label>
                    <input class="form-control p-3 bg-light border-0 rounded-3 mb-3" type="email" name="email" required>
                    <button class="btn btn-custom w-100 py-3" type="submit">SEND RESET LINK</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
