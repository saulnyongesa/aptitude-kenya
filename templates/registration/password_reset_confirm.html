{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="bk-border p-4 p-md-5">
                <h3 class="fw-bold mb-3 text-center">Choose New Password</h3>
                {% if validlink %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-custom w-100 py-3" type="submit">UPDATE PASSWORD</button>
                    </form>
                {% else %}
                    <p class="text-secondary mb-0">This reset link is invalid or has expired.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
