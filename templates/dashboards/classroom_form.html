{% extends 'base.html' %}

{% block title %}Edit Classroom{% endblock title %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="bk-border p-4 p-md-5">
                    <p class="text-uppercase small fw-bold text-success mb-1">Classroom</p>
                    <h1 class="fw-bold mb-4">Edit Classroom</h1>
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} mb-3 small">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Classroom Name</label>
                            <input class="form-control p-3 bg-light border-0 rounded-3" name="name" value="{{ classroom.name }}" required>
                        </div>
                        <button class="btn btn-custom w-100 py-3" type="submit">SAVE CLASSROOM</button>
                    </form>
                    <a class="d-inline-block mt-3 text-secondary" href="{% url 'classroom_detail' classroom.id %}">Back to classroom</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
